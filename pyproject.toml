[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-consensus"
version = "0.1.0"
description = "Multi-agent iterative consensus system for coding CLIs powered by LiteLLM"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Multi-Agent Consensus Team"}
]
dependencies = [
    "litellm>=1.0.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
viewer = [
    "streamlit>=1.20.0",
]

[project.scripts]
consensus-cli = "consensus_system.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["consensus_system*", "bug_finder*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"
